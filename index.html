<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmokeGuard | Smart Monitoring</title>

<style>
:root {
    --bg:#071426;
    --panel:#10243d;
    --panel2:#142c49;
    --cyan:#00d5ff;
    --text:#f4f8ff;
    --muted:#91a9c4;
    --green:#00dfa0;
    --yellow:#ffc857;
    --red:#ff647c;
    --border:#203c5b;
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body {
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
    min-height:100vh;
}

button,input {
    font:inherit;
}

button {
    cursor:pointer;
}

.hidden {
    display:none!important;
}

/* LOGIN */

#auth {
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.auth-box {
    width:100%;
    max-width:410px;
}

.brand {
    text-align:center;
    margin-bottom:30px;
}

.logo {
    width:65px;
    height:65px;
    border-radius:19px;
    background:var(--cyan);
    color:#071426;
    display:grid;
    place-items:center;
    font-size:32px;
    font-weight:bold;
    margin:0 auto 15px;
}

.brand h1 {
    letter-spacing:2px;
    font-size:28px;
}

.brand p {
    color:var(--muted);
    font-size:11px;
    letter-spacing:2px;
    margin-top:8px;
}

.card {
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:23px;
    margin-bottom:17px;
}

.card h2 {
    margin-bottom:10px;
}

.muted {
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
}

label {
    display:block;
    color:var(--muted);
    font-size:13px;
    margin:17px 0 8px;
}

input {
    width:100%;
    padding:13px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#071426;
    color:white;
    outline:none;
}

input:focus {
    border-color:var(--cyan);
}

.primary {
    width:100%;
    padding:14px;
    margin-top:20px;
    background:var(--cyan);
    color:#071426;
    border:0;
    border-radius:9px;
    font-weight:bold;
}

.link {
    color:var(--cyan);
    cursor:pointer;
    font-weight:bold;
}

.auth-switch {
    text-align:center;
    color:var(--muted);
    font-size:13px;
    margin-top:20px;
}

.demo-note {
    font-size:11px;
    color:var(--yellow);
    margin-top:14px;
    line-height:1.6;
}

/* APP LAYOUT */

#app {
    display:none;
    min-height:100vh;
}

.sidebar {
    width:245px;
    background:#091a30;
    border-right:1px solid var(--border);
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    padding:25px 16px;
    z-index:5;
}

.side-brand {
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:38px;
    padding-left:8px;
}

.small-logo {
    width:39px;
    height:39px;
    border-radius:11px;
    background:var(--cyan);
    color:#071426;
    display:grid;
    place-items:center;
    font-weight:bold;
    font-size:20px;
}

.side-brand h2 {
    font-size:19px;
}

.side-brand p {
    color:var(--muted);
    font-size:9px;
    margin-top:4px;
}

.menu-title {
    color:#58718e;
    font-size:10px;
    letter-spacing:2px;
    padding:0 10px;
    margin-bottom:12px;
}

.nav-btn {
    width:100%;
    text-align:left;
    padding:13px 12px;
    border:0;
    border-radius:9px;
    color:#a9bdd3;
    background:transparent;
    margin-bottom:5px;
    font-size:13px;
}

.nav-btn:hover,.nav-btn.active {
    background:#143451;
    color:var(--cyan);
}

.nav-icon {
    display:inline-block;
    width:27px;
}

.side-bottom {
    position:absolute;
    bottom:20px;
    left:16px;
    right:16px;
}

.side-bottom button {
    width:100%;
    padding:12px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--muted);
    border-radius:9px;
}

.main {
    margin-left:245px;
    min-height:100vh;
}

.topbar {
    height:75px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 35px;
    background:#091a30;
}

.topbar h2 {
    font-size:18px;
}

.user-badge {
    color:var(--cyan);
    font-size:13px;
}

.content {
    padding:32px 35px;
    max-width:1500px;
    margin:auto;
}

.page {
    display:none;
}

.page.active {
    display:block;
}

.page-heading {
    margin-bottom:25px;
}

.page-heading h1 {
    font-size:26px;
    margin-bottom:9px;
}

.page-heading p {
    color:var(--muted);
    font-size:13px;
}

/* DASHBOARD */

.grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat {
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    padding:20px;
}

.stat-label {
    color:var(--muted);
    font-size:12px;
}

.stat-value {
    font-size:29px;
    font-weight:bold;
    margin:15px 0 8px;
}

.stat-foot {
    font-size:11px;
    color:var(--muted);
}

.green {color:var(--green);}
.yellow {color:var(--yellow);}
.red {color:var(--red);}
.cyan {color:var(--cyan);}

.two-col {
    display:grid;
    grid-template-columns:1.4fr 1fr;
    gap:17px;
}

.section-title {
    font-size:15px;
    margin-bottom:18px;
}

.sensor-row {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 0;
    border-bottom:1px solid var(--border);
}

.sensor-row:last-child {
    border-bottom:0;
}

.sensor-name {
    font-size:13px;
}

.sensor-reading {
    font-size:20px;
    font-weight:bold;
}

.badge {
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:10px;
    background:#183c39;
    color:var(--green);
}

.badge.warning {
    background:#45391d;
    color:var(--yellow);
}

.badge.offline {
    background:#303b4a;
    color:#aab7c5;
}

.activity {
    padding:14px 0;
    border-bottom:1px solid var(--border);
    font-size:13px;
}

.activity:last-child {
    border-bottom:0;
}

.activity small {
    display:block;
    color:var(--muted);
    margin-top:7px;
}

/* MONITORING */

.sensor-card {
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:24px;
    margin-bottom:15px;
}

.sensor-card h3 {
    font-size:15px;
}

.big-reading {
    font-size:42px;
    font-weight:bold;
    margin:20px 0 8px;
}

.progress {
    height:7px;
    background:#203c5b;
    border-radius:10px;
    overflow:hidden;
    margin-top:17px;
}

.progress div {
    height:100%;
    background:var(--cyan);
    width:0%;
}

.info-box {
    padding:15px;
    background:#0b1b30;
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
    margin-top:15px;
}

/* MAP */

.map-area {
    height:390px;
    background:#10243d;
    border:1px solid var(--border);
    border-radius:16px;
    position:relative;
    overflow:hidden;
    background-image:
        linear-gradient(#24405a44 1px,transparent 1px),
        linear-gradient(90deg,#24405a44 1px,transparent 1px);
    background-size:45px 45px;
}

.map-center {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:#58718e;
    text-align:center;
    font-size:13px;
}

.marker {
    position:absolute;
    width:19px;
    height:19px;
    border-radius:50%;
    border:3px solid white;
    cursor:pointer;
    box-shadow:0 0 15px currentColor;
}

.marker.green {background:var(--green);}
.marker.yellow {background:var(--yellow);}
.marker.red {background:var(--red);}

.map-detail {
    margin-top:15px;
}

/* TABLE */

.table-wrap {
    overflow-x:auto;
}

table {
    width:100%;
    border-collapse:collapse;
    font-size:12px;
    min-width:500px;
}

th,td {
    padding:15px 12px;
    text-align:left;
    border-bottom:1px solid var(--border);
}

th {
    color:var(--muted);
    font-weight:normal;
}

/* ALERTS */

.alert-item {
    padding:18px;
    background:var(--panel);
    border:1px solid var(--border);
    border-left:4px solid var(--yellow);
    border-radius:10px;
    margin-bottom:12px;
}

.alert-item.critical {
    border-left-color:var(--red);
}

.alert-item p {
    color:var(--muted);
    font-size:12px;
    margin-top:8px;
}

/* PROFILE */

.profile-avatar {
    width:70px;
    height:70px;
    background:#153b58;
    border-radius:50%;
    display:grid;
    place-items:center;
    color:var(--cyan);
    font-size:25px;
    margin-bottom:15px;
}

footer {
    text-align:center;
    padding:25px;
    color:#526b87;
    font-size:10px;
}

/* RESPONSIVE */

@media(max-width:950px) {
    .grid {grid-template-columns:repeat(2,1fr);}
    .two-col {grid-template-columns:1fr;}
}

@media(max-width:650px) {
    .sidebar {
        width:100%;
        height:65px;
        top:auto;
        bottom:0;
        padding:5px;
        border-right:0;
        border-top:1px solid var(--border);
        display:flex;
        justify-content:space-around;
        align-items:center;
    }

    .side-brand,.menu-title,.side-bottom {
        display:none;
    }

    .nav-btn {
        width:auto;
        padding:10px 7px;
        margin:0;
        font-size:10px;
        text-align:center;
    }

    .nav-icon {
        display:block;
        width:auto;
        font-size:17px;
        margin-bottom:3px;
    }

    .main {
        margin-left:0;
        padding-bottom:70px;
    }

    .topbar {
        padding:0 18px;
        height:65px;
    }

    .content {
        padding:22px 15px;
    }

    .grid {
        gap:9px;
    }

    .stat {
        padding:15px 12px;
    }

    .stat-value {
        font-size:23px;
    }

    .page-heading h1 {
        font-size:22px;
    }
}
</style>
</head>

<body>

<!-- AUTHENTICATION SCREEN -->

<section id="auth">
<div class="auth-box">

    <div class="brand">
        <div class="logo">S</div>
        <h1>SmokeGuard</h1>
        <p>COMMUNITY SMOKE MONITORING</p>
    </div>

    <div class="card" id="loginPage">
        <h2>Welcome Back</h2>
        <p class="muted">เข้าสู่ระบบ SmokeGuard</p>

        <form id="loginForm">
